<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% · G-ASIAPACIFIC Leave</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #f8fafc;
				color: #0f172a;
				font-family:
					'Segoe UI',
					system-ui,
					-apple-system,
					Arial,
					sans-serif;
				padding: 1rem;
				box-sizing: border-box;
			}
			main {
				max-width: 28rem;
				text-align: center;
			}
			.status {
				color: #24599a;
				font-weight: 600;
				font-size: 0.875rem;
			}
			h1 {
				font-size: 1.5rem;
				margin: 0.5rem 0;
			}
			a {
				display: inline-block;
				margin-top: 1.5rem;
				padding: 0.625rem 1rem;
				border-radius: 0.5rem;
				background: #1c477d;
				color: #fff;
				text-decoration: none;
				font-size: 0.875rem;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="status">%sveltekit.status%</p>
			<h1>%sveltekit.error.message%</h1>
			<a href="/">Go to home</a>
		</main>
	</body>
</html>
